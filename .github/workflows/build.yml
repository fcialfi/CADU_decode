name: Build

# Tests, then the CCSDS-TM-Decoder folder (CCSDS-TM-Decoder.exe and its libraries) for
# Windows, at every push to main (or by hand from the Actions tab). The folder
# is in the artifact "CCSDS-TM-Decoder" of the run; a tag v* also attaches it, as
# a zip, to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: pytest -q
      - name: Build the CCSDS-TM-Decoder folder
        run: pyinstaller --noconfirm cadu_gui.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CCSDS-TM-Decoder
          path: dist/
      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/CCSDS-TM-Decoder -DestinationPath "dist/CCSDS-TM-Decoder_${{ github.ref_name }}.zip"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CCSDS-TM-Decoder_*.zip
